{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JAMBO Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1890ff;
            --primary-blue-dark: #0050b3;
            --neutral-bg: #f0f2f5;
            --text-primary: #262626;
            --text-secondary: #8c8c8c;
            --border-color: #d9d9d9;
        }
        
        body {
            font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--neutral-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            max-width: 420px;
            width: 100%;
        }
        
        .login-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        
        .login-header {
            background-color: var(--primary-blue);
            padding: 36px 24px;
            text-align: center;
            color: white;
            border-bottom: 1px solid var(--border-color);
        }
        
        .logo-container {
            margin-bottom: 16px;
        }
        
        .logo-container img {
            max-width: 140px;
            height: auto;
            filter: brightness(0) invert(1);
        }
        
        .login-header h3 {
            margin: 12px 0 4px;
            font-weight: 600;
            font-size: 1.25rem;
        }
        
        .login-header p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9rem;
            font-weight: 400;
        }
        
        .login-body {
            padding: 32px 24px;
        }
        
        .form-label {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        
        .form-control {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.15);
        }
        
        .input-group-text {
            background: white;
            border: 1px solid var(--border-color);
            border-right: none;
            border-radius: 4px 0 0 4px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .input-group .form-control {
            border-left: none;
            border-radius: 0 4px 4px 0;
        }
        
        .input-group:focus-within .input-group-text {
            border-color: var(--primary-blue);
        }
        
        .btn-login {
            background-color: var(--primary-blue);
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            font-weight: 500;
            font-size: 0.95rem;
            color: white;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .btn-login:hover {
            background-color: var(--primary-blue-dark);
        }
        
        .btn-login:active {
            opacity: 0.95;
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .alert {
            border-radius: 4px;
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        
        .alert-danger {
            background-color: #fff1f0;
            border-color: #ffccc7;
            color: #d4380d;
        }
        
        .alert-success {
            background-color: #f6ffed;
            border-color: #b7eb8f;
            color: #274e00;
        }
        
        .login-footer {
            text-align: center;
            padding: 16px 24px;
            background-color: #fafafa;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        .form-divider {
            margin: 20px 0 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-secondary);
            z-index: 10;
            font-size: 0.95rem;
            border: none;
            background: none;
            padding: 0;
        }
        
        .password-toggle:hover {
            color: var(--text-primary);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group:last-of-type {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-container">
                    <img src="{% static 'JAMBO.png' %}" alt="JAMBO Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <div style="display:none;">
                        <i class="bi bi-car-front-fill" style="font-size: 3.5rem;"></i>
                    </div>
                </div>
                <h3>JAMBO Parking</h3>
                <p>Management Portal</p>
            </div>
            
            <div class="login-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post" id="loginForm">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username" class="form-label">
                            Phone Number or Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-telephone"></i>
                            </span>
                            <input type="text" class="form-control" id="username" name="username" 
                                   placeholder="Enter phone or username" required autofocus>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <div class="password-wrapper">
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Enter your password" required>
                            </div>
                            <button type="button" class="password-toggle" id="togglePassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-login w-100">
                        <i class="bi bi-box-arrow-in-right me-2"></i>
                        Sign In
                    </button>
                </form>
            </div>
            
            <div class="login-footer">
                <i class="bi bi-shield-check me-1"></i>
                JAMBO Smart Parking System &copy; 2024-2026
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Password toggle
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="bi bi-eye"></i>' : '<i class="bi bi-eye-slash"></i>';
        });
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const btn = this.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
            btn.disabled = true;
        });
    </script>
</body>
</html>
