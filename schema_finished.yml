components:
  schemas:
    Category6cfEnum:
      enum:
      - parking
      - payment
      - violation
      - subscription
      - account
      - technical
      - other
      type: string
      description: |-
        * `parking` - Parking
        * `payment` - Payment
        * `violation` - Violation
        * `subscription` - Subscription
        * `account` - Account
        * `technical` - Technical
        * `other` - Other
    CategoryDd8Enum:
      enum:
      - parking
      - violations
      - payments
      - reservations
      - system
      - promo
      type: string
      description: |-
        * `parking` - Parking
        * `violations` - Violations
        * `payments` - Payments
        * `reservations` - Reservations
        * `system` - System
        * `promo` - Promotions
    ChatConversation:
      type: object
      description: Serialize chat conversations
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          type: string
          format: uuid
          readOnly: true
        user_name:
          type: string
          readOnly: true
        user_phone:
          type: string
          readOnly: true
        subject:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/ChatConversationStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        category:
          $ref: '#/components/schemas/Category6cfEnum'
        assigned_agent:
          type: string
          format: uuid
          nullable: true
        agent_name:
          type: string
          nullable: true
          readOnly: true
        agent_phone:
          type: string
          nullable: true
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        last_message:
          allOf:
          - $ref: '#/components/schemas/ChatMessage'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_name
      - agent_phone
      - created_at
      - id
      - last_message
      - subject
      - unread_count
      - updated_at
      - user
      - user_name
      - user_phone
    ChatConversationRequest:
      type: object
      description: Serialize chat conversations
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ChatConversationStatusEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        category:
          $ref: '#/components/schemas/Category6cfEnum'
        assigned_agent:
          type: string
          format: uuid
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
      required:
      - subject
    ChatConversationStatusEnum:
      enum:
      - open
      - in_progress
      - resolved
      - closed
      type: string
      description: |-
        * `open` - Open
        * `in_progress` - In Progress
        * `resolved` - Resolved
        * `closed` - Closed
    ChatMessage:
      type: object
      description: Serialize individual chat messages
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        conversation:
          type: string
          format: uuid
        sender:
          type: string
          format: uuid
          readOnly: true
        sender_name:
          type: string
          readOnly: true
        sender_phone:
          type: string
          readOnly: true
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        content:
          type: string
        attachment:
          type: string
          format: uri
          nullable: true
        is_read:
          type: boolean
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - conversation
      - created_at
      - id
      - is_read
      - read_at
      - sender
      - sender_name
      - sender_phone
      - updated_at
    CreateChatConversation:
      type: object
      description: Serializer for creating chat conversations
      properties:
        subject:
          type: string
          maxLength: 200
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        category:
          $ref: '#/components/schemas/Category6cfEnum'
      required:
      - subject
    CreateChatConversationRequest:
      type: object
      description: Serializer for creating chat conversations
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        category:
          $ref: '#/components/schemas/Category6cfEnum'
      required:
      - subject
