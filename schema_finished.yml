  /api/auth/delete-account/:
    delete:
      operationId: api_auth_delete_account_destroy
      description: Soft delete user account
      tags:
      - api
      security:
      - DeviceSessionJWT: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/location/:
    post:
      operationId: api_auth_location_create
      description: Update user location
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLocationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLocationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLocationRequest'
        required: true
      security:
      - DeviceSessionJWT: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLocation'
          description: ''
  /api/auth/login/:
    post:
